[project]
name = "hevy-coach"
version = "0.1.0"
description = "Plan the next weights and reps for your Hevy routines, with bodybuilding and powerlifting progression rules."
readme = "README.md"
authors = [{ name = "Nuo Lin" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
hevy-coach = "hevy_coach.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hevy_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
